# Builds, checks and publishes the container image on ghcr.io.
#
# A release is a version tag: git tag v0.5.0 && git push origin v0.5.0
# publishes ghcr.io/theinvisible/gopress:0.5.0, :0.5 and :latest with a
# build provenance attestation. Started by hand on a branch, the workflow
# only builds and checks.
name: image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/theinvisible/gopress

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push to ghcr.io with GITHUB_TOKEN
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git describe names the version
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Tests, govulncheck, bundled plugins up to date, image, its file
      # list and a smoke test as production runs it.
      - name: make release
        run: make release IMAGE="$IMAGE"

      - name: Image tags
        id: tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag $REF_NAME is not vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          built="$(git describe --tags --always --dirty)"
          [[ "$built" == "$REF_NAME" ]] || { echo "built version $built is not $REF_NAME" >&2; exit 1; }
          {
            echo "built=$built"
            echo "list=$version ${version%.*} latest"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: steps.tags.outcome == 'success'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        if: steps.tags.outcome == 'success'
        env:
          BUILT: ${{ steps.tags.outputs.built }}
          TAGS: ${{ steps.tags.outputs.list }}
        run: |
          for t in $TAGS; do
            docker tag "$IMAGE:$BUILT" "$IMAGE:$t"
            docker push "$IMAGE:$t"
          done
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$BUILT")"
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"
          echo "pushed $IMAGE ($TAGS) ${digest#*@}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.push.outcome == 'success'
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
