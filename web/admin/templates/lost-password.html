{{define "page"}}{{template "login-top" .}}
	<p class="message">Please enter your username or email address. You will receive an email with a link to choose a new password.</p>
	<form name="lostpasswordform" id="lostpasswordform" action="/login/lost" method="post">
		<p>
			<label for="user_login">Username or Email Address</label>
			<input type="text" name="user_login" id="user_login" class="input" value="{{.Login}}" size="20" autocapitalize="off" autocomplete="username" required autofocus>
		</p>
		<p class="submit">
			<input type="submit" id="wp-submit" class="button button-primary button-large" value="Get New Password">
			<input type="hidden" name="_csrf" value="{{.CSRF}}">
		</p>
	</form>
	<p id="nav"><a href="/login">Log in</a></p>
{{template "login-bottom" .}}{{end}}
